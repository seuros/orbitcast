# The dummy application's own database. Orbitcast never uses it: the cable
# backend is PostgreSQL and is configured in config/cable.yml.
default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
